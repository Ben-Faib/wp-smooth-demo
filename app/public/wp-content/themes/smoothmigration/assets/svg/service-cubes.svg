<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="housingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="financeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="vehicleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="commGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="insuranceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Housing Cube -->
  <g class="floating-cube housing-cube" filter="url(#drop-shadow)">
    <g transform="translate(80, 120)">
      <!-- Front face -->
      <polygon points="0,0 40,0 40,40 0,40" fill="url(#housingGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 10,-10 50,-10 40,0" fill="url(#housingGradient)" opacity="0.7"/>
      <!-- Right face -->
      <polygon points="40,0 50,-10 50,30 40,40" fill="url(#housingGradient)" opacity="0.5"/>
      
      <!-- Icon: House -->
      <path d="M12 32 L20 24 L28 32 M16 32 L16 28 L24 28 L24 32" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" 
                      attributeType="XML" 
                      type="translate" 
                      values="0,0; 0,-8; 0,0" 
                      dur="4s" 
                      repeatCount="indefinite"/>
  </g>
  
  <!-- Finance Cube -->
  <g class="floating-cube finance-cube" filter="url(#drop-shadow)">
    <g transform="translate(200, 80)">
      <!-- Front face -->
      <polygon points="0,0 40,0 40,40 0,40" fill="url(#financeGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 10,-10 50,-10 40,0" fill="url(#financeGradient)" opacity="0.7"/>
      <!-- Right face -->
      <polygon points="40,0 50,-10 50,30 40,40" fill="url(#financeGradient)" opacity="0.5"/>
      
      <!-- Icon: Dollar Sign -->
      <path d="M20 8 L20 32 M16 12 L24 12 M16 28 L24 28" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
      <path d="M14 16 C14 14 16 12 20 12 C24 12 26 14 26 16 C26 18 24 20 20 20 C16 20 14 22 14 24 C14 26 16 28 20 28 C24 28 26 26 26 24" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" 
                      attributeType="XML" 
                      type="translate" 
                      values="0,0; 0,-12; 0,0" 
                      dur="3.5s" 
                      repeatCount="indefinite"/>
  </g>
  
  <!-- Vehicle Cube -->
  <g class="floating-cube vehicle-cube" filter="url(#drop-shadow)">
    <g transform="translate(380, 140)">
      <!-- Front face -->
      <polygon points="0,0 40,0 40,40 0,40" fill="url(#vehicleGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 10,-10 50,-10 40,0" fill="url(#vehicleGradient)" opacity="0.7"/>
      <!-- Right face -->
      <polygon points="40,0 50,-10 50,30 40,40" fill="url(#vehicleGradient)" opacity="0.5"/>
      
      <!-- Icon: Car -->
      <path d="M8 24 L32 24 M8 28 L32 28" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
      <circle cx="12" cy="30" r="2" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
      <circle cx="28" cy="30" r="2" stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
      <path d="M10 24 L10 20 L14 16 L26 16 L30 20 L30 24" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" 
                      attributeType="XML" 
                      type="translate" 
                      values="0,0; 0,-6; 0,0" 
                      dur="4.8s" 
                      repeatCount="indefinite"/>
  </g>
  
  <!-- Communication Cube -->
  <g class="floating-cube comm-cube" filter="url(#drop-shadow)">
    <g transform="translate(120, 260)">
      <!-- Front face -->
      <polygon points="0,0 40,0 40,40 0,40" fill="url(#commGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 10,-10 50,-10 40,0" fill="url(#commGradient)" opacity="0.7"/>
      <!-- Right face -->
      <polygon points="40,0 50,-10 50,30 40,40" fill="url(#commGradient)" opacity="0.5"/>
      
      <!-- Icon: Phone -->
      <rect x="14" y="10" width="12" height="20" rx="2" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
      <line x1="17" y1="13" x2="23" y2="13" 
            stroke="white" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="26" r="1" fill="white" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" 
                      attributeType="XML" 
                      type="translate" 
                      values="0,0; 0,-10; 0,0" 
                      dur="3.2s" 
                      repeatCount="indefinite"/>
  </g>
  
  <!-- Insurance Cube -->
  <g class="floating-cube insurance-cube" filter="url(#drop-shadow)">
    <g transform="translate(320, 220)">
      <!-- Front face -->
      <polygon points="0,0 40,0 40,40 0,40" fill="url(#insuranceGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 10,-10 50,-10 40,0" fill="url(#insuranceGradient)" opacity="0.7"/>
      <!-- Right face -->
      <polygon points="40,0 50,-10 50,30 40,40" fill="url(#insuranceGradient)" opacity="0.5"/>
      
      <!-- Icon: Shield -->
      <path d="M20 10 L14 14 L14 22 C14 26 20 30 20 30 C20 30 26 26 26 22 L26 14 Z" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
      <path d="M18 18 L19 20 L22 16" 
            stroke="white" stroke-width="2" fill="none" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" 
                      attributeType="XML" 
                      type="translate" 
                      values="0,0; 0,-7; 0,0" 
                      dur="4.2s" 
                      repeatCount="indefinite"/>
  </g>
  
  <!-- Connecting Lines (subtle) -->
  <g class="cube-connections" opacity="0.2">
    <line x1="120" y1="140" x2="220" y2="100" stroke="#60a5fa" stroke-width="1"/>
    <line x1="220" y1="100" x2="400" y2="160" stroke="#60a5fa" stroke-width="1"/>
    <line x1="140" y1="280" x2="340" y2="240" stroke="#60a5fa" stroke-width="1"/>
    <line x1="340" y1="240" x2="400" y2="160" stroke="#60a5fa" stroke-width="1"/>
  </g>
</svg>
