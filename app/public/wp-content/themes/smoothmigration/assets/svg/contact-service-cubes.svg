<svg width="900" height="760" viewBox="0 0 700 720" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="housingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="bankingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="insuranceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="shippingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="vehicleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.9" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="3" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


  </defs>

  <!-- Housing Cube - Top Left -->
  <g class="floating-cube housing-cube" filter="url(#drop-shadow)">
    <g transform="translate(60, 80) scale(1.15)">
      <!-- Front face -->
      <polygon points="0,0 45,0 45,45 0,45" fill="url(#housingGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 11,-11 56,-11 45,0" fill="url(#housingGradient)" opacity="1"/>
      <!-- Right face -->
      <polygon points="45,0 56,-11 56,34 45,45" fill="url(#housingGradient)" opacity="1"/>

      <!-- Icon: Modern House -->
      <!-- Roof Triangle (separate component) -->
      <polygon points="12,18 22.5,10 33,18" fill="white" stroke="white" stroke-width="2.2"/>
      <!-- House Body (separate component) -->
      <rect x="12" y="18" width="21" height="10" fill="none" stroke="white" stroke-width="2.2" opacity="0.9"/>
      <!-- Door -->
      <rect x="20" y="21" width="5" height="7" fill="white" opacity="0.8"/>
      <!-- Door knob -->
      <circle cx="21.5" cy="25" r="0.8" fill="white" opacity="0.9"/>
      <!-- Windows -->
      <rect x="14" y="20" width="3" height="3" fill="white" opacity="0.8"/>
      <rect x="27" y="20" width="3" height="3" fill="white" opacity="0.8"/>
    </g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      values="0,0; 0,-10; 0,0"
                      dur="4.2s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Banking/Money Cube - Top Right -->
  <g class="floating-cube banking-cube" filter="url(#drop-shadow)">
    <g transform="translate(520, 60) scale(1.15)">
      <!-- Front face -->
      <polygon points="0,0 45,0 45,45 0,45" fill="url(#bankingGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 11,-11 56,-11 45,0" fill="url(#bankingGradient)" opacity="1"/>
      <!-- Right face -->
      <polygon points="45,0 56,-11 56,34 45,45" fill="url(#bankingGradient)" opacity="1"/>

      <!-- Icon: Money/Banknote -->
      <!-- Banknote outline -->
      <rect x="12" y="16.5" width="21" height="12" rx="2" fill="none" stroke="white" stroke-width="2.2" opacity="0.9"/>
      <!-- Simple security strip -->
      <rect x="14" y="18" width="1.5" height="10" fill="white" opacity="0.7"/>
      <!-- Big center dollar -->
      <text x="22.5" y="26.5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">$</text>
      <!-- Corner stars -->
      <circle cx="14" cy="18" r="1.2" fill="white" opacity="0.8"/>
      <circle cx="31" cy="27" r="1.2" fill="white" opacity="0.8"/>
      <!-- Simple border lines -->
      <line x1="12" y1="20" x2="33" y2="20" stroke="white" stroke-width="0.5" opacity="0.5"/>
      <line x1="12" y1="25" x2="33" y2="25" stroke="white" stroke-width="0.5" opacity="0.5"/>
    </g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      values="0,0; 0,-12; 0,0"
                      dur="3.8s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Phone Cube - Bottom Left -->
  <g class="floating-cube phone-cube" filter="url(#drop-shadow)">
    <g transform="translate(40, 450) scale(1.15)">
      <!-- Front face -->
      <polygon points="0,0 45,0 45,45 0,45" fill="url(#phoneGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 11,-11 56,-11 45,0" fill="url(#phoneGradient)" opacity="1"/>
      <!-- Right face -->
      <polygon points="45,0 56,-11 56,34 45,45" fill="url(#phoneGradient)" opacity="1"/>

      <!-- Icon: Simple Phone -->
      <!-- Phone body -->
      <rect x="16" y="12.5" width="13" height="20" rx="3" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
      <!-- Screen -->
      <rect x="18" y="16.5" width="9" height="12" rx="1" fill="white" opacity="0.7"/>
      <!-- Speaker -->
      <rect x="19.5" y="14.5" width="6" height="1" rx="0.5" fill="white" opacity="0.8"/>
      <!-- Home button -->
      <circle cx="22.5" cy="30.5" r="1.2" fill="white" opacity="0.9"/>
      <!-- Simple phone symbol -->
      <path d="M20 19.5 L20 25.5 M25 19.5 L25 25.5 M22.5 21.5 L22.5 23.5" stroke="white" stroke-width="1" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      values="0,0; 0,-8; 0,0"
                      dur="4.5s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Insurance Cube - Bottom Right -->
  <g class="floating-cube insurance-cube" filter="url(#drop-shadow)">
    <g transform="translate(540, 520) scale(1.15)">
      <!-- Front face -->
      <polygon points="0,0 45,0 45,45 0,45" fill="url(#insuranceGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 11,-11 56,-11 45,0" fill="url(#insuranceGradient)" opacity="1"/>
      <!-- Right face -->
      <polygon points="45,0 56,-11 56,34 45,45" fill="url(#insuranceGradient)" opacity="1"/>

      <!-- Icon: Heart in Shield -->
      <!-- Shield outline -->
      <path d="M22.5 7.5 L15 13.5 L15 30.5 C15 34.5 22.5 37.5 22.5 37.5 C22.5 37.5 30 34.5 30 30.5 L30 13.5 Z"
            fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
      <!-- Shield interior lines -->
      <path d="M17 15.5 L28 15.5 M17 19.5 L28 19.5 M17 23.5 L28 23.5"
            stroke="white" stroke-width="1" opacity="0.7"/>
      <!-- Heart inside shield -->
      <path d="M19 19.5 C19 17.5 20.5 16.5 22.5 18.5 C24.5 16.5 26 17.5 26 19.5 C26 22.5 22.5 25.5 22.5 25.5 C22.5 25.5 19 22.5 19 19.5 Z"
            fill="white" stroke="white" stroke-width="1.5" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      values="0,0; 0,-9; 0,0"
                      dur="4.8s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Shipping/Moving Cube - Left Side -->
  <g class="floating-cube shipping-cube" filter="url(#drop-shadow)">
    <g transform="translate(80, 280) scale(1.15)">
      <!-- Front face -->
      <polygon points="0,0 45,0 45,45 0,45" fill="url(#shippingGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 11,-11 56,-11 45,0" fill="url(#shippingGradient)" opacity="1"/>
      <!-- Right face -->
      <polygon points="45,0 56,-11 56,34 45,45" fill="url(#shippingGradient)" opacity="1"/>

      <!-- Icon: Open Cardboard Box with Arrow -->
      <!-- Box bottom and sides -->
      <path d="M12.5 32.5 L12.5 22.5 L22.5 22.5 L22.5 32.5 Z M22.5 22.5 L32.5 22.5 L32.5 32.5 L22.5 32.5 Z"
            stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Box opening flaps -->
      <path d="M12.5 22.5 L8.5 18.5 M12.5 22.5 L16.5 18.5 M22.5 22.5 L18.5 18.5 M22.5 22.5 L26.5 18.5 M32.5 22.5 L28.5 18.5 M32.5 22.5 L36.5 18.5"
            stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Vertical arrow above box -->
      <path d="M22.5 12.5 L22.5 18.5 M19.5 15.5 L22.5 12.5 L25.5 15.5"
            stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      values="0,0; 0,-11; 0,0"
                      dur="3.6s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Vehicle Cube - Right Side -->
  <g class="floating-cube vehicle-cube" filter="url(#drop-shadow)">
    <g transform="translate(500, 320) scale(1.15)">
      <!-- Front face -->
      <polygon points="0,0 45,0 45,45 0,45" fill="url(#vehicleGradient)"/>
      <!-- Top face -->
      <polygon points="0,0 11,-11 56,-11 45,0" fill="url(#vehicleGradient)" opacity="1"/>
      <!-- Right face -->
      <polygon points="45,0 56,-11 56,34 45,45" fill="url(#vehicleGradient)" opacity="1"/>

      <!-- Icon: Front-view Car (higher recognizability at small sizes) -->
      <!-- Car body -->
      <path d="M12 26 L33 26 C34.6 26 35.5 25.1 35.5 23.6 L34 19.5 C33.4 18 32.3 17 30.7 17 L14.3 17 C12.7 17 11.6 18 11 19.5 L9.5 23.6 C9.5 25.1 10.4 26 12 26 Z"
            fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <!-- Windshield -->
      <path d="M16 18 L28 18" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <!-- Headlights -->
      <circle cx="14" cy="24" r="1.5" fill="white" opacity="0.95"/>
      <circle cx="31" cy="24" r="1.5" fill="white" opacity="0.95"/>
      <!-- Grill -->
      <line x1="19" y1="24" x2="25" y2="24" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
      <!-- Bumper hint -->
      <line x1="12.5" y1="27" x2="32.5" y2="27" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
      <!-- Wheels -->
      <circle cx="16" cy="31.5" r="4.2" fill="none" stroke="white" stroke-width="2.2" opacity="0.95"/>
      <circle cx="28.5" cy="31.5" r="4.2" fill="none" stroke="white" stroke-width="2.2" opacity="0.95"/>
    </g>
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="translate"
                      values="0,0; 0,-7; 0,0"
                      dur="4.1s"
                      repeatCount="indefinite"/>
  </g>

  <!-- Subtle connecting lines between service areas -->
  <g class="cube-connections" opacity="0.22">
    <!-- Top connections -->
    <line x1="105" y1="125" x2="520" y2="105" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Side connections -->
    <line x1="125" y1="325" x2="500" y2="365" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Bottom connections -->
    <line x1="85" y1="495" x2="540" y2="525" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Corner connections -->
    <line x1="105" y1="125" x2="125" y2="325" stroke="#60a5fa" stroke-width="1"/>
    <line x1="520" y1="105" x2="500" y2="365" stroke="#60a5fa" stroke-width="1"/>
    <line x1="125" y1="325" x2="85" y2="495" stroke="#60a5fa" stroke-width="1"/>
    <line x1="500" y1="365" x2="540" y2="525" stroke="#60a5fa" stroke-width="1"/>
  </g>
</svg>
