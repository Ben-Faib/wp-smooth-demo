<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#mapGradient)" opacity="0.1"/>
  
  <!-- Stylized World Map Outlines -->
  <!-- North America -->
  <path d="M120 80 L200 70 L280 90 L320 110 L300 160 L250 180 L180 170 L120 140 Z" 
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- South America -->
  <path d="M220 180 L280 200 L300 280 L270 350 L240 340 L210 290 L200 220 Z" 
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- Europe -->
  <path d="M380 60 L420 65 L450 90 L440 120 L400 130 L370 110 L375 80 Z" 
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- Africa -->
  <path d="M380 140 L420 135 L460 160 L470 220 L450 280 L420 300 L390 290 L370 240 L375 180 Z" 
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- Asia -->
  <path d="M460 70 L580 60 L650 80 L680 120 L660 180 L620 200 L550 190 L480 150 L450 100 Z" 
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- Australia -->
  <path d="M580 260 L640 250 L680 270 L670 300 L620 310 L580 290 Z" 
        fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  
  <!-- Connection Lines (Flight Paths) -->
  <g class="flight-paths" opacity="0.4">
    <!-- North America to Europe -->
    <path d="M200 100 Q300 50 400 85" 
          fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" 
               values="0;10" dur="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Europe to Asia -->
    <path d="M420 85 Q500 70 550 90" 
          fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" 
               values="0;10" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- North America to Asia -->
    <path d="M250 90 Q450 30 580 80" 
          fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" 
               values="0;10" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Europe to Australia -->
    <path d="M430 120 Q550 200 610 270" 
          fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" 
               values="0;10" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Glowing Connection Points -->
  <g class="connection-points">
    <circle cx="200" cy="100" r="4" fill="#60a5fa" filter="url(#glow)" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="85" r="4" fill="#60a5fa" filter="url(#glow)" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="90" r="4" fill="#60a5fa" filter="url(#glow)" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="270" r="4" fill="#60a5fa" filter="url(#glow)" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
